  <section>
    <h3>📘 Book a Doubt Session</h3>

    <div class="card">
      <form onsubmit="bookDoubt(event)">
        <input type="text" id="studentName" placeholder="Your Name" required><br><br>

        <select id="teacher">
          <option>Dr. Sharma (Math)</option>
          <option>Prof. Sen (Electronics)</option>
          <option>Dr. Roy (Computer Science)</option>
        </select><br><br>

        <select id="slot">
          <option>10:00 AM - 10:30 AM</option>
          <option>11:00 AM - 11:30 AM</option>
          <option>2:00 PM - 2:30 PM</option>
        </select><br><br>

        <button type="submit">Book Session</button>
      </form>
    </div>
  </section>
