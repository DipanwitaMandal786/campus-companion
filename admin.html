  <!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
</head>
<body>

<h1>Admin Dashboard</h1>

<ul id="stats"></ul>

<script>
fetch("http://localhost/campus-backend/admin/fetch_all.php")
  .then(res => res.json())
  .then(data => {
    document.getElementById("stats").innerHTML = `
      <li>Users: ${data.users.c}</li>
      <li>Events: ${data.events.c}</li>
      <li>Community: ${data.community.c}</li>
      <li>Doubts: ${data.doubt.c}</li>
      <li>Teams: ${data.team.c}</li>
    `;
  });
</script>

</body>

<script>
firebase.auth().onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";

    const adminEmail = "dipanwita2005@gmail.com"; // put YOUR admin email here
    if (user.email !== adminEmail) {

  }
});
</script>
