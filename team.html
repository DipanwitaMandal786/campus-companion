  <section>
    <h3>🤝 Team Formation</h3>

    <div class="card">
      <h4>Create Team Requirement</h4>

      <form onsubmit="addTeam(event)">
        <input type="text" id="teamName" placeholder="Team Name" required><br><br>
        <input type="text" id="skills" placeholder="Skills Needed (e.g. Frontend, AI)" required><br><br>
        <button type="submit">Post Requirement</button>
      </form>
    </div>

    <div class="card">
      <h4>Open Team Requests</h4>
      <ul id="teamList"></ul>
    </div>
  </section>

  <script src="script.js"></script>
